{% extends "base.html" %}
{% block title %}Redigera medlem – {{ club_name }}{% endblock %}
{% block content %}
<section class="card narrow">
  <h2>Redigera {{ member['name'] }}</h2>
  <form method="post" action="{{ url_for('admin.edit_member', mid=member['id']) }}" data-autosave>
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label>Namn <input type="text" name="name" value="{{ member['name'] }}" required></label>
    <label>E-post <input type="email" name="email" value="{{ member['email'] }}" required></label>
    <label><input type="checkbox" name="is_admin" value="1" {% if member['is_admin'] %}checked{% endif %}> Admin</label>
    <label><input type="checkbox" name="voting_active" value="1" {% if member['voting_active'] %}checked{% endif %}> Har rösträtt</label>
    <label><input type="checkbox" name="in_wheel_pool" value="1" {% if member['in_wheel_pool'] %}checked{% endif %}> Kandidat i hjulet</label>
    <label><input type="checkbox" name="wheel_suspended" value="1" {% if member['wheel_suspended'] %}checked{% endif %}> Avstängd från hjulet (ej läst 2 senaste böckerna)</label>
  </form>
  <hr>
  <form method="post" action="{{ url_for('admin.delete_member', mid=member['id']) }}">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <button type="submit" class="btn danger">Ta bort medlem</button>
  </form>
</section>
{% endblock %}
